aid: apoha
name: Apoha
description: Apoha is a deep-tech molecular-science company teaching machines to understand
  matter at the molecular level. Its Liquid State sensory-intelligence platform captures
  dynamic molecular fingerprints, measuring the biophysical behavior of molecules
  under stress from minimal sample amounts, to unlock a new fundamental data class
  for AI. Its first commercial product, VIBE (Variations in Inter-facial Behaviour
  Under Excitation), predicts how drugs, foods, and materials will behave in the real
  world, serving pharmaceutical, biotech, food-and-beverage, and materials-science
  R&D. Based in San Francisco and London, Apoha emerged from stealth in 2026 with
  $36M in funding led by Singular, alongside Draper Associates, Redalpine, Seedcamp,
  Wilbe, and Nucleus.
